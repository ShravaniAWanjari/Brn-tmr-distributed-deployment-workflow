---
- name: Deploy Brain Tumor Platform
  hosts: app

  tasks:
    - name: Pull latest image from Docker Hub
      shell: docker stop brain-tumor-api || true

    - name: Remove existing container
      shell: docker rm brain-tumor-api || true

    - name: Pull latest image
      shell: docker pull 22jadex/brain-tumor-api:latest

    - name: Start container
      shell: |
        docker run -d \
        --name brain-tumor-api \
        -p 8000:8000 \
        22jadex/brain-tumor-api:latest

    - name: Wait for startup
      pause:
        seconds: 10

    - name: Health check
      shell: docker exec brain-tumor-api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      register: health_result

    - name: Display health status
      debug:
        var: health_result.status
